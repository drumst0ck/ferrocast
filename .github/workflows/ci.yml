name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Bundle builds and signs
        run: scripts/bundle.sh
      - name: Install dmgbuild (designed DMG window)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Designed DMG builds headless
        env:
          REQUIRE_DESIGNED_DMG: "1"
        run: scripts/dmg.sh
      - name: Release scripts
        run: bash scripts/tests/release_dry_run.sh
