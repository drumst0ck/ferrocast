name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
# a newer push to the same branch or PR supersedes the run in flight (master runs are never cancelled)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The release ships an x86_64 slice cross-compiled on this arm64 runner: keep it compiling.
      - name: Intel (x86_64) slice compiles
        run: cargo check --workspace --locked --target x86_64-apple-darwin
      - name: Bundle builds and signs
        run: scripts/bundle.sh
      - name: Apple Translation helper is in the bundle and signed
        run: |
          test -x dist/Ferrocast.app/Contents/MacOS/ferrocast-translate
          codesign --verify --strict dist/Ferrocast.app/Contents/MacOS/ferrocast-translate
          echo '{"cmd":"status","source":"en","target":"es"}' | dist/Ferrocast.app/Contents/MacOS/ferrocast-translate | grep -q '"status"'
      - name: Capture helper is bundled and speaks the protocol
        run: |
          test -x dist/Ferrocast.app/Contents/MacOS/ferrocast-capture
          scripts/capture-smoke.sh dist/Ferrocast.app/Contents/MacOS/ferrocast-capture
      - name: Install dmgbuild (designed DMG window)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Designed DMG builds headless
        env:
          REQUIRE_DESIGNED_DMG: "1"
        run: scripts/dmg.sh
      - name: Release scripts
        run: bash scripts/tests/release_dry_run.sh && bash scripts/tests/bundle_arch.sh && bash scripts/tests/check_universal.sh
  extensions-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions-runtime/package-lock.json
      - run: npm ci
      - name: dist/runtime.js matches src (it is embedded in the app)
        run: |
          npm run build
          git diff --exit-code -- dist
      - run: npm test
