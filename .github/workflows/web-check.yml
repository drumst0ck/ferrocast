name: Web check
on:
  push:
    branches: [master]
    paths: ['web/**', '.github/workflows/web-check.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-check.yml']
permissions:
  contents: read
concurrency:
  group: web-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated docs are up to date
        run: npm run gen:docs && git diff --exit-code -- src/content src/components/docs
      - run: npm run build
      - run: npm test
      - name: Docker image builds
        run: docker build -t ferrocast-web:ci .
