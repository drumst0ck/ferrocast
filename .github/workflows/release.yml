name: Release
# Push a tag made by scripts/release.sh (vX.Y.Z, or vX.Y.Z-rc.1 for a prerelease the app ignores).
# Works with no secrets: the app is then signed ad-hoc. To switch to Developer ID later, add the
# secrets listed under "Optional signing" and nothing else changes.
on:
  push:
    tags: ['v*']
# Third-party actions are pinned to commit SHAs (the comment names the tag). The build job has a
# read-only token and no persisted git credentials; only the publish job (no build, no tests) can write.
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on master
        run: |
          # a tag pushed from a topic branch must not publish a release
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on master" >&2; exit 1; }
      - name: Tag matches Cargo.toml
        id: meta
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          case "$version" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: bash scripts/tests/release_dry_run.sh && bash scripts/tests/bundle_arch.sh && bash scripts/tests/check_universal.sh

      # Optional signing. Secrets: APPLE_CERT_P12 (base64 of the Developer ID Application .p12),
      # APPLE_CERT_PASSWORD, APPLE_SIGN_IDENTITY ("Developer ID Application: Name (TEAMID)").
      - name: Import Developer ID certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$APPLE_SIGN_IDENTITY" ]; then
            echo "No Developer ID secrets: the app will be signed ad-hoc."
            exit 0
          fi
          kc="$RUNNER_TEMP/release.keychain-db"
          kcpass=$(uuidgen)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "FERROCAST_SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"

      # One download for Apple Silicon and Intel: every Mach-O is cross-compiled for both, then lipo-merged.
      - name: Build bundle
        env:
          UNIVERSAL: "1"
        run: scripts/bundle.sh
      - name: Every Mach-O in the bundle is arm64 + x86_64
        run: scripts/check-universal.sh dist/Ferrocast.app

      # The signing keychain is only needed by bundle.sh: drop it right away, even if the build failed.
      - name: Remove the signing keychain
        if: always()
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          if [ -f "$kc" ]; then
            security delete-keychain "$kc" || true
            security list-keychains -d user -s login.keychain-db || true
          fi

      # Optional notarization. Secrets: APPLE_NOTARY_KEY (base64 of the App Store Connect .p8),
      # APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER. Only runs together with a Developer ID identity.
      - name: Notarize and staple the app
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [ -z "${FERROCAST_SIGN_IDENTITY:-}" ] || [ -z "$APPLE_NOTARY_KEY" ]; then
            echo "Not notarizing (needs a Developer ID identity and notary secrets)."
            exit 0
          fi
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent dist/Ferrocast.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --wait
          xcrun stapler staple dist/Ferrocast.app
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Install dmgbuild (designed DMG window)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgvenv"
          "$RUNNER_TEMP/dmgvenv/bin/pip" install --quiet dmgbuild==1.6.7
          echo "DMGBUILD=$RUNNER_TEMP/dmgvenv/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Package DMG, update ZIP and checksums
        env:
          REQUIRE_DESIGNED_DMG: "1"
        run: |
          scripts/dmg.sh
          # Versionless copy so the website can link a stable "latest" download URL.
          cp "dist/Ferrocast-${VERSION}.dmg" dist/Ferrocast.dmg
          ditto -c -k --keepParent dist/Ferrocast.app "dist/Ferrocast-${VERSION}.zip"
          (cd dist && shasum -a 256 "Ferrocast-${VERSION}.dmg" Ferrocast.dmg "Ferrocast-${VERSION}.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Release notes
        run: scripts/release_notes.sh "$VERSION" > dist/notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          if-no-files-found: error
          path: |
            dist/Ferrocast-${{ env.VERSION }}.dmg
            dist/Ferrocast.dmg
            dist/Ferrocast-${{ env.VERSION }}.zip
            dist/SHA256SUMS.txt
            dist/notes.md

  publish:
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: artifacts
      - name: Locate the files
        run: |
          # upload-artifact keeps the common parent directory of the uploaded paths, so search
          notes=$(find artifacts -name notes.md | head -1)
          dist=$(dirname "$(find artifacts -name SHA256SUMS.txt | head -1)")
          echo "NOTES=$PWD/$notes" >> "$GITHUB_ENV"
          echo "DIST=$PWD/$dist" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Ferrocast ${{ env.VERSION }}
          body_path: ${{ env.NOTES }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          fail_on_unmatched_files: true
          files: |
            ${{ env.DIST }}/Ferrocast-${{ env.VERSION }}.dmg
            ${{ env.DIST }}/Ferrocast.dmg
            ${{ env.DIST }}/Ferrocast-${{ env.VERSION }}.zip
            ${{ env.DIST }}/SHA256SUMS.txt

      # The formula builds from the tag's source tarball, which exists now. Prereleases skip it.
      # Committed straight to master: GitHub Actions may not be allowed to open pull requests in this
      # repository (that setting is off), and the tap reads the formula from master.
      - name: Commit the Homebrew formula bump to master
        if: env.PRERELEASE == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B formula-bump origin/master
          scripts/update_formula.sh "$GITHUB_REPOSITORY" "$VERSION"
          if git diff --quiet -- Formula/ferrocast.rb; then
            echo "Formula already points at $VERSION"
            exit 0
          fi
          git add Formula/ferrocast.rb
          git commit -m "chore(brew): ferrocast $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
