name: Sync sitemap lastmod
on:
  push:
    branches: [master]
    # A push may not set both paths and paths-ignore. The negated pattern
    # keeps a lastmod-only commit (this job's own push) from starting a new run.
    paths:
      - 'web/**'
      - '!web/src/data/lastmod.json'

permissions:
  contents: write

# one sync at a time, never cancelled mid-run; a run that GitHub drops from the queue is covered by the next one, which syncs the whole manifest
concurrency:
  group: web-lastmod-sync
  cancel-in-progress: false

jobs:
  sync:
    # Path filters are skipped when GitHub cannot compute the diff. The actor
    # check still stops github-actions[bot] from committing again. Do not put
    # a skip-ci token in the commit message; that would skip every workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Full history: with the default shallow clone every file has the same last-commit date.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm run lastmod:sync
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lastmod.json
          git diff --staged --quiet && exit 0
          git commit -m "chore(web): sync sitemap lastmod manifest"
          # another push to master may have landed while this job ran: rebase onto it, retry once
          git pull --rebase origin master
          git push || { git pull --rebase origin master && git push; }
