name: GitHub Pages redirect shell
on:
  push:
    branches: [master]
    paths: ['web-redirect/**', '.github/workflows/pages-redirect.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
