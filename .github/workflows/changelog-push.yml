name: Push changelog
on:
  push:
    branches: [master]
    paths: ['CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
# pushes are applied in order: a second run waits for the first instead of racing it
concurrency:
  group: changelog-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run changelog:push -- --file ../CHANGELOG.md --dry-run > /dev/null
      - run: npm run changelog:push -- --file ../CHANGELOG.md
        env:
          CHANGELOG_ADMIN_TOKEN: ${{ secrets.CHANGELOG_ADMIN_TOKEN }}
          CHANGELOG_URL: ${{ vars.CHANGELOG_URL }}
