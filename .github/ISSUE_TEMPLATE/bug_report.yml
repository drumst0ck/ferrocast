name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you do, what did you expect, what happened instead }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Ferrocast version, description: "Settings → About, or `brew info ferrocast`" }
    validations: { required: true }
  - type: input
    id: macos
    attributes: { label: macOS version and chip }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Log, description: "Run “Reveal Log File” in Ferrocast and paste the relevant lines. Remove anything private.", render: text }
