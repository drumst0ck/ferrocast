[package]
name = "ferrocast-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
plist = "1"
dirs.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNRequestHandler", "VNRequest", "VNDetectFaceRectanglesRequest", "VNDetectTextRectanglesRequest", "VNObservation", "VNTypes", "objc2-core-foundation"] }
core-graphics = "0.25"
core-foundation = "0.10"
accessibility-sys = "0.2"
foreign-types-shared = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-quartz-core = "0.3"
ferrocast-core.workspace = true
block2 = "0.6"
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognizer", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFTranscription"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioEngine", "AVAudioIONode", "AVAudioNode", "AVAudioBuffer", "AVAudioFormat", "AVAudioTime", "AVAudioTypes"] }
