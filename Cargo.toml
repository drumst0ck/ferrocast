[workspace]
resolver = "2"
members = ["crates/core", "crates/macos", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
dirs = "6"
ferrocast-core = { path = "crates/core" }
ferrocast-macos = { path = "crates/macos" }

# Dependencies compile unoptimized in debug builds, and egui's font rasterizer is then slow enough
# to freeze the UI for half a second on the first frame of every new screen. Optimize them (dev
# builds only; release has its own profile below).
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
